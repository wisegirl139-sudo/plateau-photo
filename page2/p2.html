<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>rotidE-Editor</title>
        <link rel="stylesheet" href="p2.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Atomic+Age&display=swap" rel="stylesheet">
       
    </head>
    <body>
        <header>
            <h1>plateau photo </h1>
            <a href="../index.html">(click here to go home)</a>
        </header>
        <main>
            <div id="drop">
                <p>upload a png or jpg to get started</p>
                <input type="file" id="upload" accept="image/*">
            </div>
            <div id="prev">
            </div>
            <div id="fix">
                <h2>your dark room</h2>
                <h3>fixer uppers</h3>
                <label for="b">brightness</label>
                <input type="range" id="b" min="0" max="200" value="100">
                <label for="cont">contrast</label>
                <input type="range" id="cont" min="0" max="200" value="100">
                <label for="vig">vignette</label>
                <input type="range" id="vig" min="0" max="200" value="0">
                <label for="warm">warmth</label>
                <input type="range" id="warm" min="0" max="200" value="0">
                <label for="cold">cold</label>
                <input type="range" id="cold" min="0" max="200" value="0">
                <h3>transform</h3>
                <button id="rot">rotate</button>
                <button id="flip1">flip vertically</button>
                <button id="flip2">flip horizontally</button>
                <h3>effects</h3>
                <button id="og">original</button>
                <button id="gray">black and white</button>
                <button id="neg">negative</button>
                <button id="vin">vintage</button>
                <button id="reset">reset</button>
                <button id="grr">grainey film</button>
                <button id="sun">retro sunset</button>
                <button id="before">see the og</button>
                <h3>done?</h3>
                <button id="down">download ur pic</button>
            </div>
            <canvas id="clouds"></canvas>
        </main>
        <script src="https://cdn.jsdelivr.net/npm/p5@2.3.3/lib/p5.min.js"></script>
        <script src="p2.js"></script>
    </body>
</html>
